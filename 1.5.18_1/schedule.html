<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Розклад занять - єХНТУ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }

    .container {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 20px;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
    }
    
    .header h2 {
      margin: 0;
    }
    
    .header-logo {
      text-align: center;
      margin-bottom: 15px;
      width: 100%;
    }
    
    .header-logo img {
      max-width: 300px;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    
    .view-switcher {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: 15px;
    }
    
    .view-switcher label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    
    .date-picker {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
    
    button {
      padding: 8px 15px;
      background-color: #4688F1;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    button:hover {
      background-color: #3b77d9;
    }
    
    button:disabled {
      background-color: #cccccc;
    }
    
    .error-message {
      color: #dc3545;
      padding: 10px;
      margin: 10px 0;
      background-color: #f8d7da;
      border-radius: 4px;
      display: none;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      font-style: italic;
      color: #666;
      display: none;
    }
    
    .schedule-info {
      font-weight: bold;
      margin: 10px 0;
      font-size: 18px;
      color: #333;
    }
    
    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    
    .schedule-table th {
      background-color: #f5f5f5;
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
    }
    
    .schedule-table td {
      padding: 10px;
      border: 1px solid #ddd;
      vertical-align: top;
    }
    
    .type-label {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    
    .type-lecture {
      background-color: #d1ecf1;
      color: #0c5460;
    }
    
    .type-practice {
      background-color: #d4edda;
      color: #155724;
    }
    
    .type-lab {
      background-color: #fff3cd;
      color: #856404;
    }
    
    .weeks-info {
      font-size: 12px;
      color: #6c757d;
    }
    
    .weekly-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .weekly-table th:first-child {
      width: 90px;
    }

    .weekly-table th {
      background-color: #f5f5f5;
      padding: 12px;
      border: 1px solid #ddd;
      text-align: center;
      word-wrap: break-word;
    }

    .weekly-table td {
      border: 1px solid #ddd;
      padding: 8px;
      vertical-align: top;
      word-wrap: break-word;
    }

    .lesson-block {      
      padding: 8px;
      background-color: #f8f9fa;
      border-radius: 4px;
    }

    .lesson-time {
      font-weight: bold;
      margin-bottom: 4px;
    }

    /* Підсвічування поточного дня */
    .weekly-table th.current-day {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-weight: bold;
    }

    /* Підсвічування поточної пари */
    .weekly-table td.current-lesson {
      background-color: #e3f2fd;
      border: 2px solid #4688F1;
    }

    /* Плаваючий індикатор перерви */
    .break-indicator {
      background-color: #fff3cd;
      color: #856404;
      border-left: 4px solid #ffc107;
      padding: 12px 20px;
      margin: 10px 0;
      border-radius: 4px;
      font-weight: bold;
      display: none;
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .break-indicator-icon {
      font-size: 18px;
      margin-right: 8px;
    }

    /* Кнопка календарного плану в header */
    .header-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .header-button {
      padding: 8px 15px;
      background-color: #4688F1;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
    }

    .header-button:hover {
      background-color: #3b77d9;
    }

    /* Модальне вікно */
    .modal {
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background-color: white;
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 20px;
    }

    .modal-close {
      font-size: 28px;
      font-weight: bold;
      color: #999;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close:hover {
      color: #333;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-footer {
      padding: 15px 20px;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: monospace;
    }

    .form-control:focus {
      outline: none;
      border-color: #4688F1;
      box-shadow: 0 0 0 3px rgba(70, 136, 241, 0.1);
    }

    select.form-control {
      cursor: pointer;
    }

    .btn-primary, .btn-secondary {
      padding: 8px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-primary {
      background-color: #4688F1;
      color: white;
    }

    .btn-primary:hover {
      background-color: #3b77d9;
    }

    .btn-secondary {
      background-color: #f5f5f5;
      color: #333;
    }

    .btn-secondary:hover {
      background-color: #e0e0e0;
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="header-logo">
      <img src="img/header.svg" alt="єХНТУ">
    </div>
    
    <div class="header">
      <h2>Розклад занять</h2>
      <div class="header-buttons">
        <a href="settings.html" class="header-button">⚙️ Налаштувати розклад</a>
        <button id="calendarPlanButton" class="header-button" style="display: none;">📅 Календарний план</button>
      </div>
      <div class="controls">
        <div class="view-switcher">
          <label>
            <input type="radio" name="viewMode" value="day">
            День
          </label>
          <label>
            <input type="radio" name="viewMode" value="week" checked>
            Тиждень
          </label>
        </div>
        <input type="date" id="datePicker" class="date-picker">
        <button id="refreshButton">Оновити</button>
      </div>
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="loading" class="loading">Завантаження...</div>
    <div id="scheduleInfo" class="schedule-info"></div>

    <!-- Індикатор перерви -->
    <div id="breakIndicator" class="break-indicator">
      <span class="break-indicator-icon">🕒</span>
      <span id="breakIndicatorText"></span>
    </div>

    <!-- Таблиця для денного перегляду -->
    <div id="dayView">
      <table class="schedule-table">
        <thead>
          <tr>
            <th>Час</th>
            <th>Предмет</th>
            <th>Викладач/Група</th>
            <th>Тип</th>
            <th>Тижні</th>
          </tr>
        </thead>
        <tbody id="scheduleTableBody"></tbody>
      </table>
    </div>

    <!-- Таблиця для тижневого перегляду -->
    <div id="weekView" style="display: none;">
      <table class="weekly-table">
        <thead>
          <tr>
            <th>Час</th>
            <th data-day="1">Понеділок</th>
            <th data-day="2">Вівторок</th>
            <th data-day="3">Середа</th>
            <th data-day="4">Четвер</th>
            <th data-day="5">П'ятниця</th>
          </tr>
        </thead>
        <tbody id="weeklyScheduleBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Модальне вікно для календарного плану -->
  <div id="calendarPlanModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Календарний план</h3>
        <span class="modal-close">&times;</span>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="disciplineSelect">Оберіть дисципліну:</label>
          <select id="disciplineSelect" class="form-control">
            <option value="">-- Оберіть дисципліну --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Результат:</label>
          <textarea id="calendarPlanResult" class="form-control" rows="15" readonly></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button id="copyCalendarPlanBtn" class="btn-primary">Скопіювати</button>
        <button id="closeCalendarPlanBtn" class="btn-secondary">Закрити</button>
      </div>
    </div>
  </div>

  <script src="scripts/schedule.js" type="module"></script>
</body>
</html>
