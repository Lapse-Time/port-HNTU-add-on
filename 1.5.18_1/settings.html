<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Налаштування єХНТУ</title>
  <style>
    body {
      width: 600px;
      margin: 20px auto;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }
    .container {
      padding: 20px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header img {
      max-width: 150px;
      margin-bottom: 10px;
    }
    select, button {
      margin: 10px 0;
      padding: 8px;
      width: 100%;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
    button {
      background-color: #4688F1;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled {
      background-color: #cccccc;
    }
    .role-select {
      margin-bottom: 20px;
    }
    .hidden {
      display: none;
    }
    .error-message {
      color: #dc3545;
      padding: 8px;
      margin: 10px 0;
      background-color: #f8d7da;
      border-radius: 4px;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #4688F1;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="img/header.svg" alt="єХНТУ">
      <h2>Налаштування розкладу</h2>
    </div>
    
    <div class="role-select">
      <label>Оберіть роль:</label>
      <select id="roleSelect">
        <option value="">-- Оберіть роль --</option>
        <option value="student">Студент</option>
        <option value="teacher">Викладач</option>
      </select>
    </div>

    <div id="studentFlow" class="hidden">
	<label>Оберіть факультет:</label>
      <select id="facultySelect" class="hidden">
        <option value="">-- Оберіть факультет --</option>
      </select>
      
      <select id="groupSelect" class="hidden">
	  <label>Оберіть групу:</label>
        <option value="">-- Оберіть групу --</option>
      </select>
    </div>

    <div id="teacherFlow" class="hidden">
	<label>Оберіть факультет:</label>
      <select id="teacherFacultySelect" class="hidden">
        <option value="">-- Оберіть факультет --</option>
      </select>
      
	  <label>Оберіть кафедру:</label>
      <select id="cafedraSelect" class="hidden">
        <option value="">-- Оберіть кафедру --</option>
      </select>
      
	  <label>Оберіть викладача:</label>
      <select id="teacherSelect" class="hidden">
        <option value="">-- Оберіть викладача --</option>
      </select>
    </div>

    <button id="saveButton" disabled>Зберегти</button>
    
    <a href="schedule.html" class="back-link">Повернутися до розкладу</a>
  </div>
  <script src="scripts/settings.js" type="module"></script>
</body>
</html>
